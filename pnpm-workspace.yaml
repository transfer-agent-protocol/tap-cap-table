packages:
    - "app"
    - "docs"
    - "packages/*"
# ocf/ is a git submodule. Server imports JSON schemas as files; do not add it to
# the pnpm workspace — its unused docs/jest tree floods Dependabot.
# pnpm 12 reads settings here, not from package.json "pnpm".
allowBuilds:
    bufferutil: true
    esbuild: true
    unrs-resolver: true
    utf-8-validate: true
overrides:
    "@humanfs/node": "0.16.8"
    "@xmldom/xmldom": "0.9.12"
    "ajv@<7": "6.14.0"
    "ajv@>=8": "8.20.0"
    axios: "^1.13.5"
    baseline-browser-mapping: "2.11.26"
    browserslist: "4.29.1"
    body-parser: "1.20.6"
    "brace-expansion@<2": "1.1.18"
    "brace-expansion@>=2 <3": "2.1.4"
    "brace-expansion@>=3": "5.0.9"
    dompurify: "3.4.13"
    fast-uri: "3.1.8"
    "form-data@>=3 <4": "3.0.5"
    handlebars: "^4.7.9"
    ip-address: "10.3.1"
    js-yaml: "4.3.2"
    lodash: "^4.17.23"
    lodash-es: "^4.17.23"
    mermaid: "^11.16.1"
    "nanoid@<5": "3.3.18"
    "path-to-regexp@<1": "0.1.13"
    postcss: "^8.5.18"
    qs: "6.16.0"
    socket.io-parser: "^4.2.7"
    tmp: "^0.2.6"
    undici: "^6.27.0"
    "ws@>=7 <8": "7.5.11"
    "ws@>=8": "8.21.0"
    yaml: "2.8.3"
