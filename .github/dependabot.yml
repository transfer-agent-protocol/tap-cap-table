# GitHub only reads this file at the repository root. Nested .github/ folders
# in app/, docs/, server/, or chain/ are ignored — keep package-specific notes
# in WARP.md / SECURITY.md instead.
version: 2
updates:
    # One npm ecosystem: the workspace lockfile is pnpm-lock.yaml at /.
    # A second scan of /app would be a no-op (no lockfile there).
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      target-branch: "main"
      open-pull-requests-limit: 10
      groups:
          production-npm:
              dependency-type: "production"
              update-types:
                  - "minor"
                  - "patch"
          development-npm:
              dependency-type: "development"
              update-types:
                  - "minor"
                  - "patch"
      ignore:
          # Express 5 is a separate migration (path-to-regexp, error handling).
          - dependency-name: "express"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      target-branch: "main"
