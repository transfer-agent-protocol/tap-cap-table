name: Security

permissions:
    contents: read

on:
    push:
        branches: [main]
        paths:
            - "chain/src/**/*.sol"
            - "chain/test/**/*.sol"
            - "chain/script/**/*.sol"
            - "chain/foundry.toml"
    pull_request:
        branches: [main]
        paths:
            - "chain/src/**/*.sol"
            - "chain/test/**/*.sol"
            - "chain/script/**/*.sol"
            - "chain/foundry.toml"

jobs:
    invariant-tests:
        name: Invariant Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.7.1

            - name: Run invariant tests
              working-directory: chain
              run: forge test --mt invariant -vvv
