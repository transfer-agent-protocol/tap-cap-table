[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = '0.8.37'
auto_detect_solc = false
bytecode_hash = "none"
cbor_metadata = false
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = 'osaka'
extra_output = ["storageLayout"]

[invariant]
runs = 256
depth = 50
fail_on_revert = false

# Linked-library CREATE2 salt for `forge script --profile deploy` only.
# Preimage: tap.capTable.libraries.v1. A compiler bump changes the resulting addresses.
[profile.deploy]
create2_library_salt = "0x0dadbe108255a84d55a430b560fbb83d81b0b20799f1942d4ed345f663661a10"

[rpc_endpoints]
rpc_url = "${RPC_URL}"
plume_mainnet = "https://rpc.plume.org"
plume_testnet = "https://testnet-rpc.plume.org"

[etherscan]
plume_mainnet = { key = "", chain = 98866, url = "https://explorer.plume.org/api/" }
plume_testnet = { key = "", chain = 98867, url = "https://testnet-explorer.plume.org/api/" }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
