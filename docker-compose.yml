services:
    mongodb:
        # Host 27027 so TAP does not steal the default Mongo port other local apps use.
        # Inside the compose network the process still listens on 27017.
        image: mongo:latest
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: tap
            MONGO_INITDB_ROOT_PASSWORD: tap
        ports:
            - "${MONGO_PORT:-27027}:27017"
        volumes:
            - offchain-db:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        tty: true

    server:
        build:
            context: .
            dockerfile: docker/Dockerfile.server
        restart: unless-stopped
        ports:
            - 8293:8293
        environment:
            DATABASE_URL: "mongodb://tap:tap@mongodb:27017/mongo?authSource=admin&retryWrites=true&w=majority"
            DATABASE_REPLSET: "0"
            RPC_URL: ${RPC_URL:-http://host.docker.internal:8545}
            CHAIN_ID: ${CHAIN_ID:-31337}
            PRIVATE_KEY: ${PRIVATE_KEY:-}
            PORT: 8293
            POLLER_MAX_CONCURRENCY: ${POLLER_MAX_CONCURRENCY:-8}
        depends_on:
            mongodb:
                condition: service_healthy
        tty: true

    app:
        build:
            context: .
            dockerfile: docker/Dockerfile.app
            args:
                # Baked into the client bundle at image build.
                NEXT_PUBLIC_API_URL: http://server:8293
                NEXT_PUBLIC_FACTORY_ADDRESS: ${NEXT_PUBLIC_FACTORY_ADDRESS:-}
                NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-${CHAIN_ID:-98866}}
                NEXT_PUBLIC_OPERATOR_ADDRESS: ${NEXT_PUBLIC_OPERATOR_ADDRESS:-}
        restart: unless-stopped
        ports:
            - 3000:3000
        environment:
            NODE_ENV: production
            NEXT_PUBLIC_API_URL: http://server:8293
            NEXT_PUBLIC_FACTORY_ADDRESS: ${NEXT_PUBLIC_FACTORY_ADDRESS:-}
            NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-${CHAIN_ID:-98866}}
            NEXT_PUBLIC_OPERATOR_ADDRESS: ${NEXT_PUBLIC_OPERATOR_ADDRESS:-}
        depends_on:
            mongodb:
                condition: service_healthy
        tty: true

volumes:
    offchain-db:
        external: true
