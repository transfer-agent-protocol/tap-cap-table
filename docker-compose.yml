services:
    mongodb:
        # Pin major.minor (volume is Mongo 8.2). Do not use mongo:latest.
        # Host 27027 so TAP does not steal the default Mongo port other local apps use.
        # Inside the compose network the process still listens on 27017.
        image: mongo:8.2
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: tap
            MONGO_INITDB_ROOT_PASSWORD: tap
        ports:
            - "${MONGO_PORT:-27027}:27017"
        volumes:
            - offchain-db:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        tty: true

    server:
        build:
            context: .
            dockerfile: docker/Dockerfile.server
        restart: unless-stopped
        ports:
            - 8293:8293
        environment:
            DATABASE_URL: "mongodb://tap:tap@mongodb:27017/mongo?authSource=admin&retryWrites=true&w=majority"
            DATABASE_REPLSET: "0"
            RPC_URL: ${RPC_URL:-http://host.docker.internal:8545}
            CHAIN_ID: ${CHAIN_ID:-31337}
            PRIVATE_KEY: ${PRIVATE_KEY:-}
            PORT: 8293
            POLLER_MAX_CONCURRENCY: ${POLLER_MAX_CONCURRENCY:-8}
        depends_on:
            mongodb:
                condition: service_healthy
        tty: true

    app:
        build:
            context: .
            dockerfile: docker/Dockerfile.app
        restart: unless-stopped
        ports:
            - 3000:3000
        environment:
            NODE_ENV: development
            # Next server-side /api rewrites run inside this container → compose DNS.
            # Host pnpm app:dev keeps app/.env.local on http://localhost:8293.
            NEXT_PUBLIC_API_URL: http://server:8293
            NEXT_PUBLIC_FACTORY_ADDRESS: ${NEXT_PUBLIC_FACTORY_ADDRESS:-}
            NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-${CHAIN_ID:-98866}}
            NEXT_PUBLIC_OPERATOR_ADDRESS: ${NEXT_PUBLIC_OPERATOR_ADDRESS:-}
            # Docker Desktop bind mounts often miss inotify; poll so Next/Turbopack picks up edits.
            WATCHPACK_POLLING: "true"
            CHOKIDAR_USEPOLLING: "true"
            CHOKIDAR_INTERVAL: "1000"
        command: ["pnpm", "dev", "--hostname", "0.0.0.0"]
        volumes:
            # Source mounts: edit app/ or packages/ on the host without rebuilding the image.
            # Rebuild (`pnpm docker:build`) is still required after package.json / lockfile / Dockerfile changes.
            - ./app:/app/app
            - ./packages:/app/packages
            - /app/app/node_modules
        depends_on:
            mongodb:
                condition: service_healthy
        tty: true

volumes:
    offchain-db:
        external: true
